name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege that still lets deploy-pages mint its token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm install`, not `npm ci`: npm 11 records esbuild's per-platform
      # packages as `extraneous` in the lockfile even from a clean install, and
      # `npm ci` then refuses them on a different platform (EBADPLATFORM on the
      # Linux runner for the netbsd/openharmony variants). `npm install` resolves
      # optional platform deps correctly. We trade strict lockfile enforcement
      # for a deploy that works; the lockfile is still committed and respected
      # for every package that is not a platform binary.
      - run: npm install --no-audit --no-fund
      # The build script is `tsc --noEmit && vite build`, so a type error fails
      # the deploy rather than shipping. Tests run first for the same reason.
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
